{% extends 'inventario/base.html' %}

{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
<h2>Confirmar Eliminación</h2>
<p>¿Está seguro que desea eliminar al cliente <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, Eliminar</button>
    <a href="{% url 'lista_clientes' %}">Cancelar</a>
</form>
{% endblock %}
