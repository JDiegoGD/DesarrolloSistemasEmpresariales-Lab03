<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestión de Inventario{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav a { margin-right: 15px; }
        table { border-collapse: collapse; margin-top: 10px; width: 100%; }
        th, td { border: 1px solid #999; padding: 6px 10px; text-align: left; }
        th { background-color: #eee; }
        form.filtros { margin-top: 10px; padding: 10px; background: #f5f5f5; border: 1px solid #ddd; }
        form.filtros label { margin-right: 8px; }
        form.filtros select, form.filtros input { margin-right: 15px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'lista_productos' %}">Productos</a>
        <a href="{% url 'lista_clientes' %}">Clientes</a>
        <a href="{% url 'lista_usuarios' %}">Usuarios</a>
        <a href="{% url 'lista_equipos' %}">Equipos Instalados</a>
        <a href="{% url 'lista_tickets' %}">Tickets de Soporte</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
